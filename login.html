<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Ember &amp; Forno</title>
<meta name="description" content="Log in to your Ember & Forno account to track your order live and reorder past favorites in one tap.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        marinara: {50:'#fdf2f2',100:'#fbe3e3',200:'#f5c2c3',300:'#ec9598',400:'#e06569',500:'#d6383d',600:'#c1272d',700:'#9e1e23',800:'#7c171b',900:'#5c1114'},
        olive: {50:'#f4f7f0',100:'#e4ecda',300:'#a9c18e',500:'#6e9660',600:'#5b7b4e',700:'#48613d',900:'#293a22'},
        gold: {100:'#fbead0',300:'#f0cf90',400:'#f0bc6b',500:'#e8a33d',600:'#cc8722',800:'#8a5a11'},
        cream: {50:'#fffdf8',100:'#fbf3e0',200:'#f3e6c8',300:'#e7d4a8'},
        char: {50:'#f8f2ea',100:'#efe6db',600:'#3a2f27',700:'#2e2620',800:'#241e19',900:'#1b1613'}
      },
      fontFamily: { display: ['"Alfa Slab One"','serif'], body: ['Nunito','sans-serif'], mark: ['Kalam','cursive'] }
    } }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Kalam:wght@400;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-body antialiased bg-cream-100 dark:bg-char-900 text-char-900 dark:text-char-50">

<div id="page-loader"><i class="fa-solid fa-pizza-slice" aria-hidden="true"></i><span class="sr-only">Loading Ember &amp; Forno</span></div>

<div class="fixed top-0 inset-x-0 z-30 flex items-center justify-end gap-2 px-4 sm:px-6 lg:px-8 py-4">
  <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Toggle dark mode"><span class="thumb"><i class="fa-solid fa-sun text-[10px]"></i></span></button>
  <button type="button" class="dir-switch" aria-pressed="false" aria-label="Switch to Arabic (RTL)"><span class="dir-switch-label" aria-hidden="true">RTL</span></button>
</div>

<main id="main" class="min-h-screen flex items-center py-16">
  <div class="container mx-auto px-4 lg:px-8">
    <div class="max-w-md mx-auto bg-white dark:bg-char-800 rounded-3xl shadow-soft p-8 md:p-10">
      <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-2 mb-6" aria-label="Ember & Forno home">
          <span class="w-11 h-11 rounded-full bg-marinara-600 text-white flex items-center justify-center text-lg shadow-md"><i class="fa-solid fa-fire"></i></span>
          <span class="font-display text-base leading-none">Ember <span class="text-marinara-600 dark:text-gold-400">&amp;</span> Forno</span>
        </a>
        <h1 class="font-display text-2xl mb-2">Welcome Back</h1>
        <p class="text-sm opacity-70">Log in to track your order and reorder your favorites.</p>
      </div>

      <div id="loginError" class="hidden mb-5 text-sm bg-marinara-50 dark:bg-marinara-900/20 text-marinara-700 dark:text-marinara-300 border border-marinara-200 dark:border-marinara-800 rounded-xl p-3"></div>

      <form id="loginForm" data-validate-form class="space-y-5">
        <div class="form-field">
          <label for="liEmail">Email Address</label>
          <input type="email" id="liEmail" name="email" required placeholder="you@example.com">
          <span class="field-error">Enter a valid email address.</span>
        </div>
        <div class="form-field">
          <label for="liPassword">Password</label>
          <div class="relative">
            <input type="password" id="liPassword" name="password" required minlength="6" placeholder="••••••••" class="!pe-11">
            <button type="button" class="pw-toggle absolute top-1/2 -translate-y-1/2 end-3 opacity-60" data-target="liPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <span class="field-error">Password must be at least 6 characters.</span>
        </div>
        <div class="flex items-center justify-end text-sm">
          <button type="button" id="forgotBtn" class="font-bold text-marinara-600 dark:text-gold-400">Forgot password?</button>
        </div>
        <button type="submit" class="btn-crust w-full justify-center !py-3.5"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><i class="fa-solid fa-right-to-bracket"></i> Log In</button>
      </form>

      <p class="text-center text-sm opacity-70 mt-6">Don't have an account? <a href="register.html" id="registerLink" class="font-bold text-marinara-600 dark:text-gold-400">Create one</a></p>
    </div>
  </div>
</main>

<script src="assets/js/main.js"></script>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || 'dashboard.html';
    document.getElementById('registerLink').href = 'register.html?redirect=' + encodeURIComponent(redirect);

    document.querySelectorAll('.pw-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.querySelector('i').className = showing ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    });

    document.getElementById('forgotBtn').addEventListener('click', () => {
      window.EF.showToast("Password reset instructions would be emailed to you here.");
    });

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!window.EF.validateForm(form)) return;
      const email = document.getElementById('liEmail').value.trim();
      const password = document.getElementById('liPassword').value;
      const result = window.EF.loginUser(email, password);
      if (!result.ok) {
        errorBox.textContent = result.error;
        errorBox.classList.remove('hidden');
        return;
      }
      window.location.href = redirect;
    });
  })();
</script>
</body>
</html>
